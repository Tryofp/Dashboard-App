name: Publish Tryo Dashboard Release

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: dashboard-v2
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - uses: android-actions/setup-android@v3
      - name: Check Firebase configuration
        run: |
          test -f app/google-services.json || { echo "::error::Firebase config missing"; exit 1; }
      - name: Prepare release keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::Release keystore secret missing"; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tryo-dashboard-release.jks"
          chmod 600 "$RUNNER_TEMP/tryo-dashboard-release.jks"
          test -s "$RUNNER_TEMP/tryo-dashboard-release.jks"
      - name: Build signed release APK
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tryo-dashboard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          gradle assembleRelease
      - name: Verify APK signature and calculate SHA-256
        id: apk
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER" || { echo "::error::apksigner not found"; exit 1; }
          "$APKSIGNER" verify --verbose --print-certs "$APK"
          HASH="$(sha256sum "$APK" | awk '{print $1}')"
          echo "sha256=$HASH" >> "$GITHUB_OUTPUT"
      - name: Publish GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create v2.2.0 app/build/outputs/apk/release/app-release.apk \
            --title "Tryo Dashboard 2.2.0" \
            --target dashboard-v2 \
            --notes "Tryo Dashboard 2.2.0 — signed release build."
      - name: Update updater manifest
        env:
          GH_TOKEN: ${{ github.token }}
          APK_SHA256: ${{ steps.apk.outputs.sha256 }}
        run: |
          cat > remote-update.json <<EOF
          {
            "versionCode": 5,
            "versionName": "2.2.0",
            "apkUrl": "https://github.com/Tryofp/Dashboard-App/releases/latest/download/app-release.apk",
            "sha256": "$APK_SHA256",
            "releaseNotes": "Tryo Dashboard 2.2.0."
          }
          EOF
          CURRENT_SHA="$(gh api repos/Tryofp/Dashboard-App/contents/remote/update.json?ref=dashboard-v2 --jq .sha)"
          CONTENT="$(base64 -w 0 remote-update.json)"
          gh api repos/Tryofp/Dashboard-App/contents/remote/update.json \
            -X PUT \
            -f message="Publish updater manifest for Tryo Dashboard 2.2.0" \
            -f content="$CONTENT" \
            -f sha="$CURRENT_SHA" \
            -f branch="dashboard-v2"
