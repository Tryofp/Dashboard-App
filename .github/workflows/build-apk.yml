name: Build Android APK

on:
  push:
    branches: [ "main", "dashboard-v2" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.11.1
      - name: Check Firebase configuration
        run: |
          if [ ! -f app/google-services.json ]; then
            echo "::error::Tambahkan google-services.json Firebase Android ke app/google-services.json."
            exit 1
          fi
      - name: Build debug APK
        run: gradle assembleDebug
      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: dashboard-app-beta-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
      - name: Prepare release keystore
        if: github.ref == 'refs/heads/dashboard-v2'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          test -n "$KEYSTORE_BASE64" || { echo "::error::ANDROID_KEYSTORE_BASE64 belum disetel."; exit 1; }
          echo "$KEYSTORE_BASE64" | base64 --decode > "$RUNNER_TEMP/tryo-dashboard-release.jks"
          chmod 600 "$RUNNER_TEMP/tryo-dashboard-release.jks"
          test -s "$RUNNER_TEMP/tryo-dashboard-release.jks"
      - name: Build signed release APK
        if: github.ref == 'refs/heads/dashboard-v2'
        env:
          ANDROID_KEYSTORE_PATH: ${{ runner.temp }}/tryo-dashboard-release.jks
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          test -n "$ANDROID_KEYSTORE_PASSWORD" || { echo "::error::ANDROID_KEYSTORE_PASSWORD belum disetel."; exit 1; }
          test -n "$ANDROID_KEY_ALIAS" || { echo "::error::ANDROID_KEY_ALIAS belum disetel."; exit 1; }
          test -n "$ANDROID_KEY_PASSWORD" || { echo "::error::ANDROID_KEY_PASSWORD belum disetel."; exit 1; }
          gradle assembleRelease
      - name: Upload signed release APK artifact
        if: github.ref == 'refs/heads/dashboard-v2'
        uses: actions/upload-artifact@v4
        with:
          name: tryo-dashboard-release-2.2.0
          path: app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
          retention-days: 30
